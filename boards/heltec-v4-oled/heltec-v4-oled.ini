; Heltec WiFi LoRa 32 V4 + M5Stack Cap CC1101
; Full Bruce UI rendered natively on the onboard 128x64 SSD1306 OLED
; (LovyanGFX monochrome + UI_COMPACT), Sub-GHz on the M5 Cap CC1101.
; Single PRG button (GPIO0): tap=next, double-tap=select, hold=back.

[env:heltec-v4-oled]
board                           = heltec-v4-oled
board_build.arduino.memory_type = qio_qspi      ; 2MB QSPI PSRAM (ESP32-S3R2)
board_build.partitions          = custom_16Mb.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

build_src_filter = ${env.build_src_filter} +<../boards/heltec-v4-oled>

build_flags =
    ${env.build_flags}
    -Iboards/heltec-v4-oled
    -DCORE_DEBUG_LEVEL=0
    -Os
    -DUSE_DIRECT_ROTATION=1
    -DFORCE_COLOR_NORMAL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSB_as_HID=1

    ; ── OLED I2C (onboard SSD1306): SDA=17, SCL=18, RST=21, Vext=36 power ──────
    -DGROVE_SDA=17
    -DGROVE_SCL=18
    -DHAS_SCREEN=1
    -DUSE_LOVYANGFX=1
    -DLOVYAN_BUS=Bus_I2C
    -DLOVYAN_I2C_BUS=1
    -DLOVYAN_PANEL=Panel_SSD1306
    -DTFT_I2C_ADDR=0x3C
    -DTFT_ADDR=0x3C
    -DTFT_I2C_PORT=0
    -DTFT_I2C_WRITE=400000
    -DTFT_I2C_READ=400000
    -DTFT_SDA=17
    -DTFT_SCL=18
    -DTFT_RST=21
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=64
    -DTFT_MEM_WIDTH=128
    -DTFT_MEM_HEIGHT=64
    -DTFT_OFFSET_X=0
    -DTFT_OFFSET_Y=0
    -DTFT_INVERTION=0
    -DTFT_RGB_ORDER=0
    -DTFT_CS=-1
    -DTFT_BUSY_PIN=-1
    -DTFT_BL=-1
    -DBACKLIGHT=-1
    -DMINBRIGHT=0
    -DROTATION=2
    -DSMOOTH_FONT=0
    -DTFT_DISPON=0xAF
    -DTFT_DISPOFF=0xAE
    -DTFT_MONOCHROME=1
    -DUI_COMPACT=1
    -DVEXT_PIN=36            ; drives OLED/peripheral power (active LOW), handled in interface.cpp
    -DFP=1
    -DFM=1
    -DFG=2
    -DSTATUS_BAR_HEIGHT=14
    -DBORDER_PAD_Y=14
    -DBORDER_PAD_X=8

    ; ── CC1101 (M5 Cap, proven wiring) ────────────────────────────────────────
    -DSPI_MOSI_PIN=47
    -DSPI_SCK_PIN=33
    -DSPI_MISO_PIN=48
    -DSPI_SS_PIN=39
    -DUSE_CC1101_VIA_SPI
    -DCC1101_GDO0_PIN=4
    -DCC1101_SS_PIN=39
    -DCC1101_MOSI_PIN=47
    -DCC1101_SCK_PIN=33
    -DCC1101_MISO_PIN=48
    ; M5 Cap antenna switch: RF_SW0 GPIO, RF_SW1 via CC1101 GDO2/IOCFG2
    -DCAP_CC1101_SS_PIN=39
    -DCAP_CC1101_SW0_PIN=38
    -DCAP_CC1101_GDO0_PIN=4

    ; ── Single PRG button (GPIO0), active-LOW ─────────────────────────────────
    -DSEL_BTN=0
    -DBTN_ACT=LOW
    -DNO_LR_BUTTONS=1
    -DHAS_BTN=1
    -DBTN_PIN=0

    ; ── No SD / NRF24 / GPS / LoRa / Ethernet / FM on this build ───────────────
    -DSDCARD_CS=-1
    -DSDCARD_SCK=-1
    -DSDCARD_MISO=-1
    -DSDCARD_MOSI=-1
    -DDISABLE_LORA
    -DDISABLE_GPS
    -DDISABLE_ETHERNET
    -DDISABLE_FM

    ; ── IR / RF single-pin fallbacks (unused but keep macros defined) ──────────
    -DRXLED=-1
    -DTXLED=35
    -DLED_ON=HIGH
    -DLED_OFF=LOW

    -DSERIAL_TX=43
    -DSERIAL_RX=44

lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.0

lib_ignore =
    TFT_eSPI
    FastLED
